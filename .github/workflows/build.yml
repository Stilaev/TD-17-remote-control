name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Разложить файлы по папкам
        run: |
          set -e
          M=p/app/src/main
          mkdir -p $M/java/ru/td17/pult $M/assets $M/res/values $M/res/drawable $M/res/mipmap-anydpi-v26
          cp MainActivity.java MidiLink.java $M/java/ru/td17/pult/
          cp index.html $M/assets/
          cp AndroidManifest.xml $M/
          cp strings.xml styles.xml $M/res/values/
          cp ic_launcher_foreground.xml $M/res/drawable/
          cp ic_launcher.xml $M/res/mipmap-anydpi-v26/
          cat > p/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TD17Pult'
          include ':app'
          EOF
          cat > p/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > p/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > p/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ru.td17.pult'
              compileSdk 34
              defaultConfig {
                  applicationId 'ru.td17.pult'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF
          find p -type f | sort

      - name: Собрать APK
        working-directory: p
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Выложить APK для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp p/app/build/outputs/apk/debug/app-debug.apk TD17-Pult.apk
          gh release create "build-${{ github.run_number }}" TD17-Pult.apk \
            --repo "${{ github.repository }}" \
            --title "TD-17 Пульт, сборка ${{ github.run_number }}" \
            --notes "Скачайте TD17-Pult.apk и установите на телефон." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: TD17-Pult-apk
          path: TD17-Pult.apk

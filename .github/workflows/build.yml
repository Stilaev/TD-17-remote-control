name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Подготовка
        run: |
          exec > >(tee -a build-log.txt) 2>&1
          set -e
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME=$JAVA_HOME_17_X64
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          M=p/app/src/main
          mkdir -p $M/java/ru/td17/pult $M/assets $M/res/values $M/res/drawable $M/res/mipmap-anydpi-v26 p/gradle/wrapper
          cp MainActivity.java MidiLink.java $M/java/ru/td17/pult/
          cp index.html $M/assets/
          cp AndroidManifest.xml $M/
          cp strings.xml styles.xml $M/res/values/
          cp ic_launcher_foreground.xml $M/res/drawable/
          cp ic_launcher.xml $M/res/mipmap-anydpi-v26/
          cp gradle-wrapper.jar gradle-wrapper.properties p/gradle/wrapper/
          cp gradlew p/
          chmod +x p/gradlew
          echo "sdk.dir=$ANDROID_HOME" > p/local.properties
          cat > p/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TD17Pult'
          include ':app'
          EOF
          cat > p/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > p/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > p/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ru.td17.pult'
              compileSdk 34
              defaultConfig {
                  applicationId 'ru.td17.pult'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF
          find p -type f | sort

      - name: Собрать APK
        run: |
          exec > >(tee -a build-log.txt) 2>&1
          set -e
          cd p
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Выложить APK для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a build-log.txt) 2>&1
          set -e
          cp p/app/build/outputs/apk/debug/app-debug.apk TD17-Pult.apk
          gh release create "build-${{ github.run_number }}" TD17-Pult.apk \
            --repo "${{ github.repository }}" \
            --title "TD-17 Пульт, сборка ${{ github.run_number }}" \
            --notes "Скачайте TD17-Pult.apk и установите на телефон." \
            --latest

      - name: Сохранить журнал ошибки
        if: failure()
        run: |
          sleep 2
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f build-log.txt
          git commit -m "Журнал сборки ${{ github.run_number }}"
          git push -f origin build-log

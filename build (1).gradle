plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.td17.pult'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.td17.pult'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
